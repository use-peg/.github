<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">How a Peg stock market connects</title>
<desc id="desc">An underlying stock token can be wrapped into a Peg stock token. Peg stock tokens and USDG supply a pool. Liquidity providers receive LP shares representing their proportional claim on the pool assets.</desc>
